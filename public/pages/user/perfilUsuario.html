<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Mi perfil</title>
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/perfilUsuarioSyle.css">
</head>

<body class="paginas">
    <div data-header="home"></div>

    <main>

        <section class="tarjeta columnas tarjeta-perfil">
            <div class="foto-perfil-marco">
                <img class="foto_perfil foto_perfil_retrato" id="foto_usuario" src="../../assets/img/User_icon.svg">
            </div>
            <div class="tarjeta tarjeta-detalles">
                <h1 class="unifrakturmaguntia-regular" id="nombre_usuario">nombre_usuario</h1>
                <p id="agilidad_usuario">Agilidad: -</p>
                <p id="golpe_usuario">Golpe: -</p>
                <button onclick="cerrarSesion()" class="boton boton-session">Cerrar sesion</button>
            </div>
        </section>

        <section class = "tarjeta tarjeta-inventario">
            <h2 class="titulo titulo-inventario">Inventario</h2>
            <div id="inventario">
                <div class="etiqueta" id="etiqueta-der">GUANTES</div>
                <div class="etiqueta" id="etiqueta-izq">ZAPATOS</div>
                <div class="rueda" id="rueda-der"></div>
                <div class="rueda" id="rueda-izq"></div>
            </div>
        </section>
    </main>
    
    <div class="delimitador_deco"></div>
    
    <script src="../../js/login.js"></script>
    <script src="../../js/perfilUsuario.js"></script>
    <script src="../../js/header.js"></script>
    <script src="../../js/carousel.js"></script>
</body>
</html>
