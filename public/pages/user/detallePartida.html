<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de partida</title>
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/detallePartidaStyle.css">
</head>

<body class="paginas fondo">
    <div data-header="volver"></div>

    <section class="tarjeta tarjeta-borde-deco borde-deco">
        <h2 id="nombrePartida"></h2>
        <button id="boton-modificar-nombre" type="button">Modificar nombre</button>
        <h3 id="mensaje"></h3>

        <!--Resultado-->
        <div class="resultado-box">
            <p>
                <strong id="nombreJugador"></strong>
                <span id="puntajeJugador"></span>
            </p>
            <span>VS</span>
            <p>
                <strong id="nombreRival"></strong>
                <span id="puntajeRival"></span>
            </p>
        </div>

        <!--Datos adicionales-->
        <ul class="ficha-datos">
            <li>
                <p>Dificultad</p>
                <strong id="dificultad"></strong>
            </li>
            <li>
                <p>Duración</p>
                <strong id="duracion"></strong>
            </li>
            <li>
                <p>Superficie</p>
                <strong id="tipoCancha"></strong>
            </li>
            <li>
                <p>Estado</p>
                <strong id="estado"></strong>
            </li>
        </ul>

    </section>

    <script src="../../js/header.js"></script>
    <script src="../../js/detallePartida.js">  </script>
    <script src="../../js/musica.js"></script>
</body>

</html>
